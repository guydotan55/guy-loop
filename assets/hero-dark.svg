<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">guy-loop</title><desc id="d">A Claude Code skill: spec, two independent reviews, a reviewed plan, then one Codex build.</desc>
