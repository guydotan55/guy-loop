<text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#59636E">Spec it. Review it twice. Plan it.</text>
<text x="80" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#59636E">Review the plan. Then one Codex build.</text>
<text x="80" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#59636E">A Claude Code skill for reviewed builds</text>
